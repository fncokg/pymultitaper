site_name: pymultitaper
docs_dir: mkdocs_docs
site_url: https://fncokg.github.io/pymultitaper/docs/
repo_url: https://github.com/fncokg/pymultitaper/
edit_uri: docs/
theme:
    name: "material"

plugins:
    - mkdocstrings:
        handlers:
            python:
                options:
                    show_root_toc_entry: false
                    heading_level: 3
                    show_symbol_type_heading: true
                    show_symbol_type_toc: true
                    docstring_section_style: list
    - autorefs
nav:
    - Quickstart: index.md
    - API Reference: api.md
markdown_extensions:
    - pymdownx.highlight:
          anchor_linenums: true
          line_spans: __span
          pygments_lang_class: true
    - pymdownx.inlinehilite
    - pymdownx.snippets
    - pymdownx.superfences
